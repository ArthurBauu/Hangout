name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Install Android SDK command-line tools and packages
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euxo pipefail
          LOG_FILE="$GITHUB_WORKSPACE/sdk-install.log"
          sudo apt-get update
          sudo apt-get install -y unzip curl libglu1-mesa libpulse0
          mkdir -p "$ANDROID_SDK_ROOT"
          # Try two specific cmdline-tools versions as Google 'latest' may change
          CANDIDATES=(
            "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
            "https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip"
          )
          attempts=0
          success=0
          for url in "${CANDIDATES[@]}"; do
            attempts=0
            while [ $attempts -lt 3 ]; do
              attempts=$((attempts+1))
              echo "Downloading $url (attempt $attempts)" | tee -a "$LOG_FILE"
              curl -fSL --retry 3 --retry-delay 5 -o cmdline.zip "$url" 2>&1 | tee -a "$LOG_FILE" || true
              if [ ! -s cmdline.zip ]; then
                echo "cmdline.zip empty or missing, retrying" | tee -a "$LOG_FILE"
                sleep 2
                continue
              fi
              unzip -q -o cmdline.zip -d "$ANDROID_SDK_ROOT/cmdline-tools" 2>&1 | tee -a "$LOG_FILE" || {
                echo "unzip failed, removing and retrying" | tee -a "$LOG_FILE"
                rm -f cmdline.zip
                sleep 2
                continue
              }
              success=1
              break
            done
            if [ $success -eq 1 ]; then break; fi
          done
          if [ $success -ne 1 ]; then
            echo "Failed to download and extract cmdline tools" | tee -a "$LOG_FILE"
            exit 1
          fi
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then mv -f "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"; fi
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          (yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2") 2>&1 | tee -a "$LOG_FILE" || true
          (yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses) 2>&1 | tee -a "$LOG_FILE" || true
          echo "SDK contents:" 2>&1 | tee -a "$LOG_FILE" && ls -la "$ANDROID_SDK_ROOT" 2>&1 | tee -a "$LOG_FILE"
          sdkmanager --list --sdk_root="$ANDROID_SDK_ROOT" 2>&1 | tee -a "$LOG_FILE" || true

      - name: Upload SDK install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-install-log
          path: ${{ github.workspace }}/sdk-install.log

      - name: Build (assembleDebug + assembleAndroidTest)
        run: ./gradlew assembleDebug assembleAndroidTest --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  integration:
    name: Integration (manual) - Emulator UI tests
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run emulator and instrumentation tests (manual)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

  firebase_test:
    name: Firebase Test Lab (manual)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download APKs from build
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: ./apks

      - name: Setup gcloud (service account)
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT }}
          export_default_credentials: true

      - name: Run Firebase Test Lab instrumentation
        env:
          GCLOUD_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          set -euxo pipefail
          gcloud --quiet firebase test android run \
            --type instrumentation \
            --app ./apks/app-debug.apk \
            --test ./apks/app-debug-androidTest.apk \
            --device model=Pixel4,version=33,locale=en,orientation=portrait \
            --timeout 30m


