name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Android SDK and emulator (action)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-accel -no-snapshot-load -no-snapshot-save
          # Run build and tests from inside the action after the emulator is ready.
          script: |
            # wait for adb and for the device to report boot completed
            adb start-server || true
            for i in {1..60}; do
              if adb devices | grep -q "emulator-"; then
                if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; then
                  echo "Device booted"; break
                fi
              fi
              echo "Waiting for emulator to boot... ($i)"; sleep 5
            done
            ./gradlew assembleDebug --no-daemon --stacktrace
            ./gradlew test --no-daemon --stacktrace

      
